    <style>
      html, body { margin: 0; min-height: 100%; background: #0d0d12; }
      #boot-screen {
        position: fixed;
        inset: 0;
        z-index: 80;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 20px;
        background: #0d0d12;
        color: #a9a4b2;
        font: 400 1.15rem/1.3 "Cormorant Garamond", Georgia, serif;
      }
      #boot-screen svg { width: min(52vw, 188px); overflow: visible; }
      #boot-screen path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      #boot-screen .book-line { stroke: #b79b72; stroke-width: 1.7; }
      #boot-screen .page-line { stroke: rgba(243, 239, 231, 0.3); stroke-width: 1.15; }
      #boot-screen .current {
        stroke: #d5b98c;
        stroke-width: 2.3;
        stroke-dasharray: 26 240;
        filter: drop-shadow(0 0 7px rgba(213, 185, 140, 0.9));
        animation: ink-current 2.2s linear infinite;
      }
      #boot-screen p { margin: 0; }
      @keyframes ink-current { to { stroke-dashoffset: -266; } }
    </style>
    <script>
      window.setTimeout(function () {
        var screen = document.getElementById('boot-screen')
        if (!screen) return
        var label = screen.querySelector('p')
        if (label) label.textContent = 'Долгая загрузка. Проверьте сеть и откройте Mini App ещё раз.'
      }, 12000)
    </script>
